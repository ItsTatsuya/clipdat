[package]
name = "clipdat"
version = "0.3.0"
description = "Clipdat - native video player and clipper"
license = "MIT"
repository = "https://github.com/ItsTatsuya/clipdat"
edition = "2021"
build = "build.rs"

[[bin]]
name = "clipdat"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["process", "io-util", "net", "time", "sync", "macros", "rt-multi-thread", "fs"] }
raw-window-handle = "0.6"
dirs = "6"
rfd = "0.15"
smol = "2"
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
